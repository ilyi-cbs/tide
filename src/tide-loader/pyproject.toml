[project]
name = "tide-source-loader"
version = "0.1.0"
description = "Verified source-only intake and read-only delta decoding for the src CAP model"
requires-python = ">=3.12"
dependencies = ["duckdb>=1.1"]

[project.scripts]
tide-load = "loader.intake:main"
tide-load-delta = "loader.delta_cli:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loader"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project]
name = "agent"
version = "0.1.0"
description = "tide chat agent: LangGraph + MCP tool loop over AG-UI/SSE"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langchain-core>=1.6.5",
    "ag-ui-langgraph==0.0.45",  # exact: api/agui.py relies on its internals (A8)
    "ag-ui-protocol>=1.0.0",
    "litellm>=1.83",
    "mcp>=2.2.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "httpx2>=2.0.0",
    "jsonschema>=4.0.0",
]

[dependency-groups]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "ruff>=0.9.0", "pyright>=1.1.407"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.pyright]
include = ["src/agent"]
extraPaths = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportDeprecated = false

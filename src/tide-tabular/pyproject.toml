[project]
name = "tabular"
version = "0.1.0"
description = "tide tabular inference service: stateless fit+predict on rows sent by CAP (contract v2)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "numpy>=2.0",
    "pandas>=2.0",
    "tabpfn-client==0.6.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.0.0",
    "mypy==1.18.2",
    "pytest>=8.3.0",
    "respx>=0.23.1",
    "ruff>=0.9.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tabular"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[project.scripts]
tabular = "tabular.api.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["src/tabular"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["pandas.*", "tabpfn_client.*"]
ignore_missing_imports = true
